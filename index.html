<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#24133f" />
    <meta
      name="description"
      content="Hiên — Luyện IELTS theo kỹ năng. Làm bài, kiểm tra kết quả và theo dõi tiến độ."
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Hiên — IELTS Practice</title>
    <script>
      // Set the theme before first paint to avoid a light flash in dark mode.
      (function () {
        var saved = null;
        try {
          saved = localStorage.getItem('hien.theme');
        } catch (e) {}
        var dark = saved ? saved === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
